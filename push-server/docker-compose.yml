services:
  push-server:
    build: .
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_EMAIL=${VAPID_EMAIL:-mailto:admin@chainreaction.game}
      - ALEPHIUM_NODE_URL=${ALEPHIUM_NODE_URL:-https://node.mainnet.alephium.org}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - POLL_INTERVAL=${POLL_INTERVAL:-10000}
    restart: unless-stopped
